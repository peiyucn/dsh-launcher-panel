<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB0FF"/>
      <stop offset="0.55" stop-color="#4D8DFE"/>
      <stop offset="1" stop-color="#3A5FEE"/>
    </linearGradient>
    <linearGradient id="splash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7D2FF"/>
      <stop offset="1" stop-color="#6F9CFF"/>
    </linearGradient>
  </defs>
  <!-- tail fin -->
  <path fill="url(#body)" d="M96 58 C102 48 112 40 122 38 L116 52 C122 52 126 54 127 58 C118 66 108 68 99 66 Z"/>
  <!-- body: round head left, tapered right -->
  <path fill="url(#body)" d="M14 76 C14 52 30 38 52 38 C74 38 94 44 102 56 C104 60 104 64 102 68 C104 76 100 84 92 86 C82 92 66 94 52 92 C30 90 14 88 14 76 Z"/>
  <!-- belly: thick crescent -->
  <path fill="#FFFFFF" d="M20 76 C24 90 40 96 58 96 C74 96 88 90 95 82 C86 86 72 88 56 87 C40 86 28 82 20 76 Z"/>
