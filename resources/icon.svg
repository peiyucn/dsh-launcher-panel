  <circle fill="#FFFFFF" cx="34.5" cy="60" r="1.6"/>
  <!-- chest fin -->
  <path fill="#3B57E8" d="M40 88 C50 88 60 92 63 99 C58 104 48 105 40 100 C36 97 37 92 40 88 Z"/>
  <!-- splash: cloud of circles + drops -->
  <g fill="url(#splash)">
    <circle cx="67" cy="25" r="8"/>
    <circle cx="77" cy="21" r="6.5"/>
    <circle cx="86" cy="27" r="7.5"/>
    <circle cx="76" cy="32" r="7"/>
    <circle cx="57" cy="10" r="5"/>
    <circle cx="95" cy="13" r="4.5"/>
    <circle cx="51" cy="24" r="3.5"/>
