name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests + vsce package)
        run: npm run verify

      - name: Verify VSIX artifact exists
        run: |
          ls -la *.vsix
          test -f *.vsix || (echo "VSIX not produced" && exit 1)
