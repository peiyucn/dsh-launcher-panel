name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc)
        run: npm run compile

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  package:
    name: package
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Package extension
        run: npm run package
      - name: Verify VSIX artifact exists
        run: |
          ls -la *.vsix
          test -f *.vsix || (echo "VSIX not produced" && exit 1)
