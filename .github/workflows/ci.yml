name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint + repository policy)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (JUnit report)
        run: node --test --test-isolation=none --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-report.xml "test/*.test.ts"
      - name: Verify the report was written
        run: test -s test-report.xml || (echo "test-report.xml missing or empty" && exit 1)
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: test-report.xml
          retention-days: 7

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Verify output file
        run: test -f out/extension.js || (echo "out/extension.js missing" && exit 1)

  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Package extension (vsce)
        run: npm run package
      - name: Verify VSIX artifact exists
        run: |
          ls -la releases/*.vsix
          test -f releases/*.vsix || (echo "VSIX not produced" && exit 1)
