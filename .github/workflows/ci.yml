name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Verify output file
        run: test -f out/extension.js || (echo "out/extension.js missing" && exit 1)

  package:
    name: package
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Package extension (vsce)
        run: npm run package
      - name: Verify VSIX artifact exists
        run: |
          ls -la *.vsix
          test -f *.vsix || (echo "VSIX not produced" && exit 1)

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "publish 实质由 publish.yml 在 tag 触发时执行，此处空跑占位"

  deploy:
    name: deploy
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "deploy 空跑（本仓库无部署目标）"

  sync:
    name: sync
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "sync 空跑（本仓库无数据同步）"
