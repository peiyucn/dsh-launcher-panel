name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (JUnit report)
        # Node stops parsing its own options at the first positional argument, so
        # the reporter flags must come BEFORE the test-file pattern. With them
        # after, they were read as extra file patterns: the run still passed and
        # printed normal output, but no report was written, and the upload step
        # below silently skipped (`if: always()` + a missing path is a warning,
        # not a failure). Keep the spec reporter on stdout so the log stays
        # readable.
        run: node --test --test-isolation=none --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-report.xml "test/*.test.ts"
      - name: Verify the report was written
        # Fail loudly rather than uploading nothing: a missing artifact should
        # not be indistinguishable from a green run.
        run: test -s test-report.xml || (echo "test-report.xml missing or empty" && exit 1)
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: test-report.xml
          retention-days: 7

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Verify output file
        run: test -f out/extension.js || (echo "out/extension.js missing" && exit 1)

  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc → out/)
        run: npm run compile
      - name: Package extension (vsce)
        run: npm run package
      - name: Verify VSIX artifact exists
        run: |
          ls -la releases/*.vsix
          test -f releases/*.vsix || (echo "VSIX not produced" && exit 1)
