name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # 发布环境：Deployments 页留下每次发布记录（dsh-sparrow / pi 仓库同款做法）
    environment: marketplace-publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package extension
        run: |
          mkdir -p releases
          npx --yes @vscode/vsce package --no-dependencies --out releases/

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath releases/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract changelog for release
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # 从两份 CHANGELOG 抽取本版本条目，英文在上、中文在下拼成发布说明。
          # 用 index() 前缀匹配而非正则：awk 里 \[ 是非法转义会退化成字符类，匹配失效。
          extract() {
            awk -v ver="${VERSION}" '
              BEGIN { found=0; lines="" }
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { lines = lines $0 "\n" }
              END { printf "%s", lines }
            ' "$1"
          }
          extract CHANGELOG.md > release-body-en.md
          extract CHANGELOG.zh-CN.md > release-body-zh.md
          {
            if [[ -s release-body-en.md ]]; then printf '### English\n\n'; cat release-body-en.md; fi
            if [[ -s release-body-zh.md ]]; then printf '\n### 中文\n\n'; cat release-body-zh.md; fi
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: releases/*.vsix
