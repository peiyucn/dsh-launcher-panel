name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: write
      security-events: read
      vulnerability-alerts: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag 提交不在 main 上：先把改动合入 main 再打 tag（E16）"
            exit 1
          fi

      - name: Require zero open security alerts (E18)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN_ALERTS: ${{ github.token }}
          SECRET_SCAN_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: bash scripts/check-security-alerts.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package extension
        run: |
          mkdir -p releases
          npx --yes @vscode/vsce package --no-dependencies --out releases

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath releases/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract changelog for release
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          extract() {
            awk -v ver="${VERSION}" '
              BEGIN { found=0; lines="" }
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { lines = lines $0 "\n" }
              END { printf "%s", lines }
            ' "$1"
          }
          extract CHANGELOG.md > release-body-en.md
          extract CHANGELOG.zh-CN.md > release-body-zh.md
          {
            if [[ -s release-body-en.md ]]; then printf '### English\n\n'; cat release-body-en.md; fi
            if [[ -s release-body-zh.md ]]; then printf '\n### 中文\n\n'; cat release-body-zh.md; fi
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: releases/*.vsix
